[package]
name = "ai-youtube-os-desktop"
version = "1.0.0"
description = "AI YouTube Automation OS - Desktop Control Panel"
authors = ["AI YouTube OS Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "notification", "shell-open", "system-tray", "http-request" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
